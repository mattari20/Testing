<!doctype html><html><head><style>.v2-preview-page{width:794px;height:1123px;box-sizing:border-box;overflow:hidden;position:relative}.v2-preview-page>[data-v2-fragment-of]{position:absolute;left:0;top:0;width:794px}</style></head><body><div id="editor"><div data-v2-editor-form></div><div id="preview"></div><div id="fragment-source"></div></div><script type="module">
import { mountV2EditorRuntime } from '/src/ui/editor-runtime.js';
import { switchTemplate } from '/src/ui/template-preview-controller.js';
import { loadNativeTemplateSource } from '/src/templates/native-template-source-loader.js';
import { mountTemplatePreview } from '/src/ui/template-preview-mounter.js';
import { createApplicationSnapshot } from '/src/application/cv-application.js';

const input={profileData:{careerData:{identity:{fullName:'Browser User',jobTitle:'Engineer'},sections:[{id:'personal',type:'personal',title:'Personal',visibility:true,fields:[{id:'name',type:'text',label:'Name',value:'Browser User',visibility:true}],entries:[]},{id:'summary',type:'summary',title:'Summary',visibility:true,fields:[{id:'text',type:'text',label:'Summary',value:'Browser test summary',visibility:true}],entries:[]}]}}};
window.editorRuntime=mountV2EditorRuntime(document.querySelector('#editor'),input);
window.editorRuntimeTestReady=true;

window.runTemplatePreview=async(id)=>{
 switchTemplate(window.editorRuntime.surface,id,{templateVersion:'2.0.0'});
 const source=await loadNativeTemplateSource(id);
 const app=window.editorRuntime.surface.getState().session.application;
 const snapshot=createApplicationSnapshot(app);
 return mountTemplatePreview(document.querySelector('#preview'),source.sourceHtml,snapshot,{templateId:id,templateVersion:source.version});
};

</script></body></html>
