<style>
    /* SCOPED CSS FOR CV_T5 - NAVY & LIGHT GREY PROFESSIONAL */
    :root {
        --primary: #1e3a68; 
    }
    
    .T05-Simple-CV-Graphics-Web-Designer {
         
        --sidebar-bg: #e6e7e8; 
        --text-dark: #333333;
        --text-light: #ffffff;
        --border-color: #d1d3d4;
        
        width: 210mm;
        height: 297mm;
        background: white;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        margin: 0 auto;
        overflow: hidden;
        font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
        color: var(--text-dark);
        line-height: 1.3;
        position: relative;
        border: 1px solid #000000;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    /* Full-Width Header */
    .T05-Simple-CV-Graphics-Web-Designer header {
        width: 100%;
        height: 140px; 
        background: var(--primary);
        color: var(--text-light);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        border-bottom: 2px solid white;
    }

    .T05-Simple-CV-Graphics-Web-Designer .name-text {
        font-size: 32pt;
        font-weight: 700;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 1px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .title-text {
        font-size: 14pt;
        text-transform: uppercase;
        margin-top: 5px;
        font-weight: 400;
        letter-spacing: 2px;
    }

    /* Fixed Profile Photo Container */
    .T05-Simple-CV-Graphics-Web-Designer .block-photo {
        position: absolute;
        top: 90px; 
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 160px;
        z-index: 30;
        background: transparent;
    }

    .T05-Simple-CV-Graphics-Web-Designer .block-photo::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 8px solid white;
        outline: 5px solid var(--primary);
        background: white;
        box-sizing: border-box;
        z-index: -2;
    }

    

    .T05-Simple-CV-Graphics-Web-Designer .block-photo img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        position: relative;
        z-index: 10;
    }

    /* Contact Block */
    .T05-Simple-CV-Graphics-Web-Designer .contact-block {
        background-color: var(--primary-light80);
        display: flex;
        justify-content: space-between;
        padding: 20px 60px 10px 60px;
        border-bottom: 5px solid var(--primary) !important;
        z-index: 20;
        position: relative;
    }

    .T05-Simple-CV-Graphics-Web-Designer .contact-column {
        width: 42%;
    }
    .T05-Simple-CV-Graphics-Web-Designer .contact-column:last-child {
        display: flex;
        flex-direction: column;
        align-items: flex-end; /* Aligns items to the right side */
        text-align: right;     /* Ensures multi-line text wraps cleanly to the right */
    }

    .T05-Simple-CV-Graphics-Web-Designer .contact-item-header {
        display: flex;
        align-items: center;
        font-size: 12pt;
        margin-bottom: 6px;
        color: #000000;
    }

    .T05-Simple-CV-Graphics-Web-Designer .contact-item i {
        margin-right: 12px;
        font-size: 11pt;
        color: var(--primary);
        width: 20px;
        text-align: center;
    }

    .T05-Simple-CV-Graphics-Web-Designer .body-wrapper {
        display: flex;
        flex: 1;
    }

    .T05-Simple-CV-Graphics-Web-Designer aside {
        width: 45%;
        background-color: #ffffff;
        padding: 30px 30px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-color);
    }

    .T05-Simple-CV-Graphics-Web-Designer .sidebar-section {
        margin-bottom: 10px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .sidebar-title {
        font-size: 16pt;
        font-weight: 700;
        color: var(--primary);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        letter-spacing: 1px;
        border-bottom: 1.5px solid var(--primary);
        padding-bottom: 2px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .sidebar-title i {
        margin-right: 12px;
        font-size: 14pt;
    }

    .T05-Simple-CV-Graphics-Web-Designer .summary {
        font-size: 11pt;
        line-height: 1.5;
        color: #111;
        text-align: justify;
    }

    /* MODERN BADGE SKILLS STYLE */
    .T05-Simple-CV-Graphics-Web-Designer .skills-badge-container {
        display: flex;
        flex-wrap: wrap;   /* Automatically drops skills to the next line safely */
        gap: 8px;          /* Clean spacing between layout badges */
        padding-top: 5px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .skill-badge {
        font-size: 9.5pt;
        font-weight: 500;
        color: var(--primary);
        background-color: var(--primary-light70); /* Extremely soft accent background */
        padding: 5px 12px;
        border-radius: 4px; /* Slight roundness for a modern look */
        border: 2px solid var(--primary-light70);
        transition: all 0.2s ease;
    }
    
    .T05-Simple-CV-Graphics-Web-Designer .lang-item {
        margin-bottom: 12px;
        font-weight: 500;
    }
    
    /* LANGUAGES SECTION MODERN STYLING (MATCHED WITH SKILLS) */
    .T05-Simple-CV-Graphics-Web-Designer .languages-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 5px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .lang-badge {
        font-size: 9.5pt;
        font-weight: 500;
        color: var(--primary);
        background-color: var(--primary-light70); /* Same light tint as skills */
        padding: 8px 16px;
        border-radius: 20px; /* Same clean square-round edges */
        border: 1px solid var(--primary-light70);
        transition: all 0.2s ease;
    }    

    .T05-Simple-CV-Graphics-Web-Designer main {
        width: 55%;
        padding: 30px 30px 30px 30px;
        display: flex;
        flex-direction: column;
    }

    .T05-Simple-CV-Graphics-Web-Designer .main-section {
        margin-bottom: 5px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .section-title {
        font-size: 16pt;
        font-weight: 700;
        color: var(--primary);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        letter-spacing: 1px;
        border-bottom: 1.5px solid var(--primary);
        padding-bottom: 2px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .section-title i {
        margin-right: 12px;
        font-size: 14pt;
    }

    .T05-Simple-CV-Graphics-Web-Designer .list-container {
        position: relative;
        padding-left: 20px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .list-container::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 0;
        width: 2px;
        height: calc(100% - 20px);
        background: var(--border-color);
    }

    .T05-Simple-CV-Graphics-Web-Designer .timeline-item {
        position: relative;
        margin-bottom: 25px;
        display: flex;
    }

    .T05-Simple-CV-Graphics-Web-Designer .timeline-item::before {
        content: "";
        position: absolute;
        top: 10px;
        left: -25px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
        border: 2px solid white;
        z-index: 5;
    }

    .T05-Simple-CV-Graphics-Web-Designer .timeline-left {
        width: 30%;
        padding-right: 5px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .timeline-right {
        width: 70%;
    }

    .T05-Simple-CV-Graphics-Web-Designer .timeline-role {
        font-size: 10pt;
        font-weight: 700;
        color: var(--primary);
    }
    
    .T05-Simple-CV-Graphics-Web-Designer .timeline-institution {
        font-size: 10pt;
        font-weight: 700;
        color: #000;
    }
    
    .T05-Simple-CV-Graphics-Web-Designer .timeline-date-badge {
        display: inline-block;
        background: var(--primary);
        color: var(--text-light);
        padding: 3px 10px;
        font-size: 8pt;
        font-weight: 600;
        border-radius: 15px;
        margin-top: 5px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .timeline-desc {
        font-size: 9pt;
        color: #555;
        line-height: 1.4;
    }

    /* PERSONAL INFO STYLING */
    .T05-Simple-CV-Graphics-Web-Designer .list-item {
        display: flex;
        flex-direction: column;
        gap: 10px;                  /* Generates clean, uniform spacing between rows */
        padding: 5px 0 15px 0;
    }

    .T05-Simple-CV-Graphics-Web-Designer .item-description {
        font-size: 9.5pt;          /* Matches your skills and timeline details */
        color: #444444;            /* Soft dark charcoal for premium readability */
        line-height: 1.4;
        display: grid;
        grid-template-columns: 95px 1fr; /* Label takes exactly 110px, values align perfectly after */
        align-items: start;
        border-bottom: 1px dashed var(--border-color); /* Subtle modern divider */
        padding-bottom: 4px;
    }

    .T05-Simple-CV-Graphics-Web-Designer .item-description b {
        color: var(--primary);     /* Links label text to your primary Navy identity */
        font-weight: 900;
    }


    @media print {
        .T05-Simple-CV-Graphics-Web-Designer {
            margin: 0;
            border: none;
            box-shadow: none;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    }

    .T05-Simple-CV-Graphics-Web-Designer [data-v2-list-style="inline"]{display:inline!important;margin-right:4px}
    .T05-Simple-CV-Graphics-Web-Designer [data-v2-list-style="bullets"]{display:list-item!important;margin-left:16px}
    .T05-Simple-CV-Graphics-Web-Designer [data-v2-list-style="compact"]{display:inline-block!important;margin-right:4px;padding-top:2px;padding-bottom:2px}
    .T05-Simple-CV-Graphics-Web-Designer [data-v2-list-style="stacked"]{display:block!important}
    .T05-Simple-CV-Graphics-Web-Designer [data-v2-list-style="pills"]{display:inline-flex!important}
    .T05-Simple-CV-Graphics-Web-Designer .v2-proficiency{display:inline-flex;align-items:center;gap:4px;margin-left:6px;vertical-align:middle;white-space:nowrap;font-size:.82em;font-weight:600;line-height:1}
    .T05-Simple-CV-Graphics-Web-Designer .v2-proficiency-label{font-weight:600}
    .T05-Simple-CV-Graphics-Web-Designer .v2-proficiency-score{font-size:.82em;opacity:.82}
    .T05-Simple-CV-Graphics-Web-Designer .v2-proficiency-visual{display:inline-flex;align-items:center;gap:2px;letter-spacing:0}
    .T05-Simple-CV-Graphics-Web-Designer .v2-proficiency-visual::first-letter{letter-spacing:0}
    .T05-Simple-CV-Graphics-Web-Designer .v2-proficiency-bar{display:inline-block;width:10px;height:4px;border:1px solid currentColor;border-radius:2px;box-sizing:border-box}
    .T05-Simple-CV-Graphics-Web-Designer .v2-proficiency-bar.is-on{background:currentColor}
</style>

<div class="T05-Simple-CV-Graphics-Web-Designer" data-v2-template-root data-v2-template-id="t05-simple-cv-graphic-web-designer_modern" data-v2-template-version="2.0.0">

        <div  data-v2-section="photo" data-v2-visible-when="section:photo" class="block-photo profile-photo-container shape-rounded" data-v2-layout-block data-v2-layout-block-id="v2-photo-1" data-v2-layout-kind="image">

    <div class="contact-block">

                    <span data-v2-value="identity.phone"></span>
                </div>
                
                
                
                <div  data-v2-visible-when="identity.whatsapp" class="contact-item-header">
                    <b><i class="fab fa-whatsapp" style="margin-left: 1px; margin-right: 12px;"></i></b>
                    <span data-v2-value="identity.whatsapp"></span>
                </div>
                
                
                <div  data-v2-visible-when="identity.email" class="contact-item-header">

    <div class="body-wrapper">

                <div class="sidebar-title"><i class="fas fa-user"></i>About me</div>
                <div class="summary"><span data-v2-value="section:summary:text"></span></div>
            </div>
            

            <div class="sidebar-section">
                <div class="sidebar-title"><i class="fas fa-id-card"></i>Personal Info</div> <!-- Changed icon to id-card to distinct from Skills line chart -->
                <div class="list-item">
                    <div  data-v2-visible-when="identity.dateOfBirth" class="item-description"><b>Date of Birth:</b> <span><span data-v2-value="identity.dateOfBirth"></span></span></div>
                    <div  data-v2-visible-when="identity.cnic" class="item-description"><b>CNIC:</b> <span><span data-v2-value="identity.cnic"></span></span></div>
                    <div  data-v2-visible-when="identity.religion" class="item-description"><b>Religion:</b> <span><span data-v2-value="identity.religion"></span></span></div>
                    <div  data-v2-visible-when="identity.linkedin" class="item-description"><b>LinkedIn:</b> <span><span data-v2-value="identity.linkedin"></span></span></div>
                    <div  data-v2-visible-when="identity.website" class="item-description"><b>Website:</b> <span><span data-v2-value="identity.website"></span></span></div>
                </div>
            </div>

            </div>

                        </div>
                        <div class="timeline-right">

<section  data-v2-section="projects" data-v2-visible-when="section:projects" class="main-section" data-v2-layout-block data-v2-layout-block-id="v2-projects-7" data-v2-layout-kind="project-entry">

                <div class="timeline-desc"><span data-v2-entry-value="desc"></span></div>

        </div>
        
    </div>
</section>

            
            
        </main>
    </div>
