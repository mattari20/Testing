<style>

.t01-modern-minimalist-cv-design-ats .ats-list li:before{content:"•";margin-right:5px;color:var(--ats-accent)}
.t01-modern-minimalist-cv-design-ats .ats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
