<style>
    :root {
        --primary: #1e3a68; 
    }
    .t06-professional-cv-graphic-designer_modern {
        /* Color Configuration */
        --text-dark: #000000;
        --text-light: #ffffff;
        --divider-color: #ffffff44;
        --main-padding: 30px;

        /* A4 Constraints */
        width: 210mm;
        height: 297mm;
        margin: 0 auto;
        background: #ffffff;
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        box-sizing: border-box;
        overflow: hidden;
        position: relative; /* Base tracking layer */
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    .t06-professional-cv-graphic-designer_modern * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* --- Background Layer Color Split --- */
    /* Forces the vertical sidebar background color to go from absolute top to bottom */
    .t06-professional-cv-graphic-designer_modern .cv-background-columns {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        z-index: 1;
        pointer-events: none; 
    }
    .t06-professional-cv-graphic-designer_modern .bg-sidebar {
        width: 35%;
        background-color: var(--primary-light80) !important;
        height: 100%;
    }
    .t06-professional-cv-graphic-designer_modern .bg-main {
        width: 65%;
        background-color: #ffffff;
        height: 100%;
    }

    /* --- Content Layer Layout --- */
    .t06-professional-cv-graphic-designer_modern .cv-content-wrapper {
        position: relative;
        z-index: 2; /* Sits over the background tracking color */
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    /* Top Spacer Block matches layout widths so sidebar background hits the absolute top */
    .t06-professional-cv-graphic-designer_modern .top-spacer {
        height: 50px;
        width: 100%;
        display: flex;
    }
    .t06-professional-cv-graphic-designer_modern .top-spacer-left {
        width: 35%;
        background-color: transparent; 
    }
    .t06-professional-cv-graphic-designer_modern .top-spacer-right {
        width: 65%;
        background-color: #ffffff;
    }

    /* Horizontal Header Section - Spans edge-to-edge; text starts right at the left border */
    .t06-professional-cv-graphic-designer_modern .cv-header {
        background-color: var(--primary) !important;
        height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-left: var(--main-padding); 
        color: var(--text-light);
        position: relative;
        width: 100%; 
    }

    .t06-professional-cv-graphic-designer_modern .header-text {
        font-size: 26pt;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 700;
        margin-bottom: 5px;
    }

    .t06-professional-cv-graphic-designer_modern .title-text {
        font-size: 14pt;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.9;
    }

    /* Fixed Profile Photo Container - Shifted left with 5px theme-colored border */
    .t06-professional-cv-graphic-designer_modern .profile-photo-container {
        position: absolute;
        right: 80px; /* Moved left to leave space on the right side of the page */
        top: 50%;
        transform: translateY(-50%); 
        width: 120px;
        height: 145px;
        border-radius: 4px;
        border: 5px solid var(--primary); /* Updated to 5px thickness and primary theme color */
        overflow: hidden;
        z-index: 20; 
        background: #eee;
    }

    .t06-professional-cv-graphic-designer_modern .profile-photo-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Structured Layout Grid under Header */
    .t06-professional-cv-graphic-designer_modern .cv-body {
        display: flex;
        flex: 1;
        width: 100%;
    }

    /* Left Sidebar Text Columns */
    .t06-professional-cv-graphic-designer_modern aside {
        width: 35%;
        color: #000000; /* Changed text color to a crisp dark gray for effortless reading on the light tint background */
        padding: 30px 25px 25px 25px; 
    }

    .t06-professional-cv-graphic-designer_modern aside h3 {
        font-size: 14pt;
        text-transform: uppercase;
        border-bottom: 2px solid var(--primary-light60);
        padding-bottom: 5px;
        margin-bottom: 15px;
        margin-top: 25px;
        color: var(--primary);
    }

    .t06-professional-cv-graphic-designer_modern .contact-item {
        margin-bottom: 12px;
        font-size: 10pt;
        display: flex;
        align-items: flex-start; /* Keeps wrapped multi-line text top-aligned */
        color: #000000; 
        width: 100%;
        
    }
    
    .t06-professional-cv-graphic-designer_modern .contact-item b {
        color: var(--primary); 
        display: inline-flex;  
        align-items: center;   
        white-space: nowrap;   
        width: 80px;           /* Increased to create a uniform vertical alignment column */
        flex-shrink: 0;        
        margin-right: 10px;    /* Provides clean, reliable spacing right before the text value begins */
    }

    .t06-professional-cv-graphic-designer_modern .sidebar-list {
        list-style: none;
        font-size: 10pt;
        line-height: 1.6;
    }

    /* Right Main Content Area */
    .t06-professional-cv-graphic-designer_modern main {
        width: 65%;
        padding: 30px 30px 30px 30px; 
        background: transparent; 
    }

    .t06-professional-cv-graphic-designer_modern .section-label,
    .t06-professional-cv-graphic-designer_modern .section-label h3 {
        display: flex;
        align-items: center;
    }

    /* Main Area labels keep their standard color layout */
    .t06-professional-cv-graphic-designer_modern main .section-label {
        margin-bottom: 10px;
        margin-top: 15px;
        font-size: 14pt;
        color: var(--primary);
        text-transform: uppercase;
        margin-right: 0;
        width: 100%;
        white-space: nowrap;
    }

    /* Consistent section headings: title first, then a centered theme-color rule. */
    .t06-professional-cv-graphic-designer_modern .section-label {
        display: flex;
        align-items: center;
        gap: 0;
    }

    .t06-professional-cv-graphic-designer_modern .section-label h3 {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        font: inherit;
        color: inherit;
        text-transform: inherit;
        font-weight: 700;
    }

    /* Consistent prominence and breathing room between each heading icon and title. */
    .t06-professional-cv-graphic-designer_modern .section-label > i,
    .t06-professional-cv-graphic-designer_modern .section-label h3 > i {
        margin-right: 8px;
    }

    .t06-professional-cv-graphic-designer_modern .section-label {
        font-weight: 700;
    }

    .t06-professional-cv-graphic-designer_modern .section-label > .line,
    .t06-professional-cv-graphic-designer_modern aside .section-label::after {
        flex-shrink: 0;
    }

    .t06-professional-cv-graphic-designer_modern .section-label > .line {
        flex: 1 1 auto;
        min-width: 12px;
        height: 2px;
        background-color: var(--primary);
        margin-left: 10px;
        align-self: center;
    }

    /* Sidebar labels use the same heading rhythm and rule without changing section layout. */
    .t06-professional-cv-graphic-designer_modern aside .section-label {
        margin-bottom: 10px;
        margin-top: 25px;
        font-size: 14pt;
        color: var(--primary);
        text-transform: uppercase;
        white-space: nowrap;
        border-bottom: 0;
        padding-bottom: 4px;
        width: 100%;
    }

    .t06-professional-cv-graphic-designer_modern aside .section-label::after {
        content: "";
        display: block;
        flex: 1 1 auto;
        min-width: 10px;
        height: 2px;
        background-color: var(--primary);
        margin-left: 10px;
        align-self: center;
    }

    /* Give contact labels/icons clear, consistent breathing room. */
    .t06-professional-cv-graphic-designer_modern .contact-item b {
        gap: 6px;
    }

    .t06-professional-cv-graphic-designer_modern .contact-item b i {
        margin-right: 0;
        width: 14px;
        min-width: 14px;
        flex: 0 0 14px;
        text-align: center;
        color: var(--primary);
    }

    .t06-professional-cv-graphic-designer_modern .section-label i {
        margin-right: 8px;
        font-size: 0.9em;
        width: 18px;
        min-width: 18px;
        text-align: center;
        flex: 0 0 18px;
    }

    .t06-professional-cv-graphic-designer_modern main .content-block {
        text-align: justify;
        text-justify: inter-word;
    }

    .t06-professional-cv-graphic-designer_modern .content-block {
        margin-bottom: 20px;
        font-size: 10.5pt;
        color: var(--text-dark);
        line-height: 1.5;
    }
    
    /* Timeline Layouts */
    .t06-professional-cv-graphic-designer_modern .timeline-section {
        margin-top: 15px;
        padding-left: 5px;
    }

    .t06-professional-cv-graphic-designer_modern .education-item,
    .t06-professional-cv-graphic-designer_modern .experience-item {
        margin-bottom: 18px;
    }

    .t06-professional-cv-graphic-designer_modern .edu-header-row,
    .t06-professional-cv-graphic-designer_modern .exp-header-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 3px;
    }

    /* Typography Rules */
    .t06-professional-cv-graphic-designer_modern .edu-institute,
    .t06-professional-cv-graphic-designer_modern .exp-company {
        font-size: 11pt;
        font-weight: 700;
        color: #2c3e50;
    }

    .t06-professional-cv-graphic-designer_modern .exp-date {
        font-size: 9.5pt;
        color: #000000;
        font-weight: 500;
    }

    .t06-professional-cv-graphic-designer_modern .exp-role {
        display: block;
        font-size: 10pt;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 4px;
    }

    .t06-professional-cv-graphic-designer_modern .exp-description {
        font-size: 10pt;
        color: #555555;
        line-height: 1.4;
    }

    /* Accent Decorative Divider Line */
    .t06-professional-cv-graphic-designer_modern .line {
        flex-grow: 1;
        height: 1px;
        background-color: #e0e0e0;
        margin-left: 15px;
    }

    /* Contact Info & Skill Tags */
    .t06-professional-cv-graphic-designer_modern .contact-info {
        margin-bottom: 20px;
    }

    .t06-professional-cv-graphic-designer_modern .contact-item b {
        color: var(--primary); /* Text labels like "Phone" now use the primary theme accent */
    }

    .t06-professional-cv-graphic-designer_modern .contact-item b i {
        margin-right: 8px;
        width: 14px;
        text-align: center;
        color: var(--primary); /* FontAwesome icons in sidebar updated from white to primary theme accent */
    }

    .t06-professional-cv-graphic-designer_modern .skill-tag {
        display: inline-block;
        background-color: var(--dark-bg); /* Darkened background tint for clear visibility */
        padding: 4px 10px;
        border-radius: 4px;
        margin-right: 6px;
        margin-bottom: 8px;
        font-size: 9pt;
        color: var(--primary); /* Text inside skill tags changed to primary color for top contrast */
        font-weight: 600;
    }
    
    /* ATOMIC ACHIEVEMENTS */
    .t06-professional-cv-graphic-designer_modern .ach-item {
        font-size: 12px;
        margin-bottom: 5px;
        padding-left: 15px;
        position: relative;
        color: #000000;
    }
    .t06-professional-cv-graphic-designer_modern .ach-item::before {
        content: "•";
        position: absolute;
        left: 3px;
        top: -4px;                    /* Counteracts the font's natural low baseline drift */
        font-size: 1.9em;             /* Increases the size so it looks intentional and sharp */
        line-height: 1;               /* Eliminates standard line heights pulling it down */
        color: var(--primary);
    }
    
    

    .t06-professional-cv-graphic-designer_modern [data-v2-list-style="inline"]{display:inline!important;margin-right:4px}
    .t06-professional-cv-graphic-designer_modern [data-v2-list-style="bullets"]{display:list-item!important;margin-left:16px}
    .t06-professional-cv-graphic-designer_modern [data-v2-list-style="compact"]{display:inline-block!important;margin-right:4px;padding-top:2px;padding-bottom:2px}
    .t06-professional-cv-graphic-designer_modern [data-v2-list-style="stacked"]{display:block!important}
    .t06-professional-cv-graphic-designer_modern [data-v2-list-style="pills"]{display:inline-flex!important}
    .t06-professional-cv-graphic-designer_modern .v2-proficiency{display:inline-flex;align-items:center;gap:4px;margin-left:6px;vertical-align:middle;white-space:nowrap;font-size:.82em;font-weight:600;line-height:1}
    .t06-professional-cv-graphic-designer_modern .v2-proficiency-label{font-weight:600}
    .t06-professional-cv-graphic-designer_modern .v2-proficiency-score{font-size:.82em;opacity:.82}
    .t06-professional-cv-graphic-designer_modern .v2-proficiency-visual{display:inline-flex;align-items:center;gap:2px;letter-spacing:0}
    .t06-professional-cv-graphic-designer_modern .v2-proficiency-visual::first-letter{letter-spacing:0}
    .t06-professional-cv-graphic-designer_modern .v2-proficiency-bar{display:inline-block;width:10px;height:4px;border:1px solid currentColor;border-radius:2px;box-sizing:border-box}
    .t06-professional-cv-graphic-designer_modern .v2-proficiency-bar.is-on{background:currentColor}
</style>

<div class="t06-professional-cv-graphic-designer_modern" data-v2-template-root data-v2-template-id="t06-professional-cv-graphic-designer_modern" data-v2-template-version="2.0.0">

        <div class="cv-body">

                    <div  data-v2-visible-when="identity.cnic" class="contact-item">

                    <div  data-v2-visible-when="identity.religion" class="contact-item">

                    </div>
                    

                    
                    <div  data-v2-visible-when="identity.linkedin" class="contact-item">

                <div class="sidebar-list">
