

<style>
    :root {
        --primary: #1a3365; 
    }
    .t01-modern-minimalist-cv-design {
        --sidebar-bg: var(--primary);
        --text-dark: #333333;
        --text-light: #ffffff;
        --border-color: #e0e0e0;
        width: 210mm;
        min-height: 297mm;
        background: white;
        /* PROFESSIONAL FIX: Enforcement of Flex Direction */
        display: flex !important;
        flex-direction: row !important;
        box-sizing: border-box;
        margin: 0 auto;
        padding: 0;
        overflow: hidden;
        font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
        color: var(--text-dark);
        line-height: 1.4;
    }

    .t01-modern-minimalist-cv-design aside {
        width: 35%;
        background-color: var(--primary);
        color: var(--text-light);
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        z-index: 10;
        flex-shrink: 0; /* Prevents sidebar from squashing */
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    /* Template-specific Profile Image Styling */
.t01-modern-minimalist-cv-design .profile-photo-container {
    padding-top: 30px;
    padding-bottom: 1px;
    text-align: center;         /* Centers block and inline elements inside natively */
    width: 100%;
    box-sizing: border-box;
}

.t01-modern-minimalist-cv-design .profile-photo-container img {
    width: 150px;
    height: auto;
    aspect-ratio: 1 / 1.25;
    object-fit: cover;
    border-radius: 12px; 
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5); 
    
    /* Forces alignment layout mechanics */
    display: inline-block;     
    margin: 0 auto; 
}

    .t01-modern-minimalist-cv-design .sidebar-content {
        padding: 25px 25px; 
    }

    .t01-modern-minimalist-cv-design .sidebar-section {
        margin-bottom: 30px;
    }

    .t01-modern-minimalist-cv-design .sidebar-title {
        font-size: 14pt;
        font-weight: 700;
        margin-bottom: 15px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255,255,255,0.3);
        padding-bottom: 5px;
        letter-spacing: 1px;
    }

    .t01-modern-minimalist-cv-design .contact-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 12px; 
        font-size: 9.5pt;
        line-height: 1.3;
    }

    .t01-modern-minimalist-cv-design .contact-item.align-top {
        align-items: flex-start;
    }

    .t01-modern-minimalist-cv-design .contact-icon {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 24px;
        height: 24px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        margin-right: 10px;
        margin-top: 2px;
        font-size: 10pt;
        flex-shrink: 0;
    }

    .t01-modern-minimalist-cv-design .contact-details {
        display: flex;
        flex-direction: column;
    }

    .t01-modern-minimalist-cv-design .contact-label {
        font-weight: 700;
        font-size: 7pt;
        text-transform: uppercase;
        opacity: 0.8;
        letter-spacing: 0.5px;
    }

    .t01-modern-minimalist-cv-design .contact-value {
        word-break: break-all;
    }

    .t01-modern-minimalist-cv-design main {
        width: 65%;
        padding: 50px 40px 40px 40px; 
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }
    
    

    

    .t01-modern-minimalist-cv-design .name-text {
        font-size: 26pt;
        font-weight: 800; 
        color: var(--primary);
        
        margin-top: -30px;
        line-height: 1.0;
        letter-spacing: -1px;
    }

    .t01-modern-minimalist-cv-design .title-text {
        font-size: 15pt;
        color: #555;
        margin-top: 1px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .t01-modern-minimalist-cv-design .summary {
        font-size: 10pt;
        margin-bottom: 10px;
        margin-top: 5px;
    }

    .t01-modern-minimalist-cv-design .section-title {
        font-size: 14pt;
        font-weight: 700;
        color: var(--primary);
        margin-top: 12px;
        margin-bottom: 6px;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .t01-modern-minimalist-cv-design .list-item {
        margin-bottom: 15px;
    }

    .t01-modern-minimalist-cv-design .item-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        width: 100%;
    }

    .t01-modern-minimalist-cv-design .item-title {
        font-weight: 700;
        font-size: 11pt;
        color: var(--text-dark);
    }

    .t01-modern-minimalist-cv-design .item-date {
        font-size: 9pt;
        color: #888;
        font-weight: 400;
    }
    /* This forces the custom SVGs to be white and centered */
    .t01-modern-minimalist-cv-design .contact-icon svg {
        width: 14px;      /* Matches the size of FontAwesome icons */
        height: 14px;
        fill: #ffffff;    /* Forces the icon color to WHITE */
        display: block;
    }

    .t01-modern-minimalist-cv-design .item-subtitle {
        font-size: 10pt;
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 4px;
        display: block;
    }

    .t01-modern-minimalist-cv-design .item-description {
        font-size: 10pt;
        color: #555;
        line-height: 1.5;
    }

    .t01-modern-minimalist-cv-design .sidebar-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .t01-modern-minimalist-cv-design .skill-tag {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 8.5pt;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: inline-block;
    }

    .t01-modern-minimalist-cv-design .bar-container {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
        margin-top: 5px;
        margin-bottom: 15px;
        overflow: hidden;
    }
    .t01-modern-minimalist-cv-design .bar-fill {
        height: 100%;
        background: #ffffff;
        border-radius: 3px;
    }
    
    
    .t01-modern-minimalist-cv-design .languages-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}

.t01-modern-minimalist-cv-design .lang-item {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;             /* FIX: Changes text color to bright white */
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 8.5pt;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.2);
}
    
    
/* Full column horizontal space for title + date row */
.t01-modern-minimalist-cv-design .exp-header-row,
.t01-modern-minimalist-cv-design .edu-header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    margin-top: 8px;
}

/* Company / Institute Name Styling */
.t01-modern-minimalist-cv-design .exp-company,
.t01-modern-minimalist-cv-design .edu-institute {
    font-size: 11pt;
    font-weight: 700;
    color: var(--text-dark);
}

/* Right-aligned Date / Year Label Styling */
.t01-modern-minimalist-cv-design .exp-date {
    font-size: 9.5pt;
    color: #555555;
    font-weight: 400;
}

/* Role / Degree Subtitle Styling */
.t01-modern-minimalist-cv-design .exp-role {
    font-size: 10.5pt;
    color: var(--primary);
    font-weight: 700;
    font-style: italic;     /* Matches image_8cb0e0.png sample text layout */
    display: block;
    margin-top: 2px;
    margin-bottom: 4px;
}

/* Generates a clean structural gap between separate records */
.t01-modern-minimalist-cv-design .experience-item,
.t01-modern-minimalist-cv-design .education-item {
    margin-bottom: 18px;          /* ADDED: Creates distinct separation between block entries */
    width: 100%;
}

/* Fixes the lower description spacing */
.t01-modern-minimalist-cv-design .exp-description {
    font-size: 10pt;
    color: #555555;
    line-height: 1.5;
    margin-top: 4px;              /* ADDED: Spaces description nicely below the sub-roles */
}

/* Wrapper structural margin adjustments */
.t01-modern-minimalist-cv-design .timeline-section {
    margin-bottom: 15px;
    width: 100%;
}


.t01-modern-minimalist-cv-design .section-label {
    font-size: 14pt;
    font-weight: 700;
    color: var(--primary);
    margin-top: 20px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    width: 100%;
    
    /* Elegant full column underline border layout */
    border-bottom: 1px solid #eeeeee !important;
    padding-bottom: 5px;
    display: flex;
    align-items: center;
}

/* Remove internal font-awesome icons from headers to match layout image sample */
.t01-modern-minimalist-cv-design .section-label i {
    
}


    @media print {
        .t01-modern-minimalist-cv-design { margin: 0; border: none; }
    }
</style>
