<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eStudent CV Templates — Compare</title><style>body{margin:0;background:#f5f8fc;color:#172033;font-family:Inter,system-ui,sans-serif}.head{background:linear-gradient(135deg,#0d6efd,#084298);color:#fff;padding:20px}.wrap{max-width:1400px;margin:20px auto;padding:0 16px}.table{overflow:auto;background:#fff;border:1px solid #dfe5ee;border-radius:14px}.grid{display:grid;grid-template-columns:220px repeat(3,minmax(220px,1fr));min-width:900px}.cell{padding:12px;border-right:1px solid #dfe5ee;border-bottom:1px solid #dfe5ee}.top{font-weight:800}.muted{color:#667085;font-size:12px}button{padding:8px 11px;border:1px solid #dfe5ee;border-radius:8px;background:#fff;cursor:pointer}.primary{background:#0d6efd;color:#fff;border-color:#0d6efd}</style></head><body><header class="head"><strong>eStudent.pk — CV Template Comparison</strong><div>Compare templates by career level, industry, style and capabilities.</div></header><main class="wrap"><div id="comparison"></div></main><script type="module">import{listNativeV2Templates}from'./src/templates/v2-native-template-catalog.js';const all=listNativeV2Templates();const selected=all.slice(0,3);const root=document.querySelector('#comparison');const rows=[['Career level',t=>t.careerLevel.join(', ')],['Industry',t=>t.industry.join(', ')],['Style',t=>t.style.join(', ')],['Sections',t=>t.supportedSections.join(', ')],['ATS profile',t=>t.ats?.profile||'Standard'],['Photo',t=>t.photo?.supported?'Supported':'Not supported'],['Online CV',t=>t.outputs?.onlineCV?'Supported':'Not available'],['DOCX',t=>t.outputs?.docx?'Supported':'Not available']];const g=document.createElement('div');g.className='table';const grid=document.createElement('div');grid.className='grid';const blank=document.createElement('div');blank.className='cell top';blank.textContent='Capability';grid.append(blank);selected.forEach(t=>{const c=document.createElement('div');c.className='cell top';c.innerHTML='<div>'+t.name+'</div><div class="muted">'+t.id+'</div><button class="primary">Build Online</button>';c.querySelector('button').onclick=()=>location.href='./index.html?template='+encodeURIComponent(t.id);grid.append(c)});rows.forEach(([label,fn])=>{const a=document.createElement('div');a.className='cell top';a.textContent=label;grid.append(a);selected.forEach(t=>{const b=document.createElement('div');b.className='cell';b.textContent=fn(t);grid.append(b)})});g.append(grid);root.append(g);</script></body></html>
