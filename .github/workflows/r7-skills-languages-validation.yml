name: R7 Skills Languages Validation
on:
  push:
    branches:
      - feat/r7-skills-languages-architecture
  workflow_dispatch:
jobs:
  r7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: R7 architecture regression
        run: npm run test:r7-skills-languages
      - name: Existing editor command and form regression
        run: npm run test:m64 && npm run test:m72
      - name: Existing template regression
        run: npm run test:m14 && npm run test:m15 && npm run test:m89
