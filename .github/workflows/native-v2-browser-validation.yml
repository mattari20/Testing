name: Native V2 Browser Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependency
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run M26 real browser evidence validation
        run: npm run test:m26

      - name: Upload M26 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-native-browser-evidence
          path: artifacts/m26/
          if-no-files-found: ignore
