name: Native V2 Browser Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependency
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run M20 browser validation
        run: node --test tests/m20/native-v2-browser-validation.test.js

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20-native-browser-validation
          path: artifacts/m20-native-browser-validation.json
          if-no-files-found: ignore
