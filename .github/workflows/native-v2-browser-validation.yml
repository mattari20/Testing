name: Native V2 Browser Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache is intentionally not enabled here because this repository does not commit a package-lock.json.

      - name: Install browser test dependency
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Golden Baseline fixture inputs
        run: npm run test:golden-fixtures

      - name: Run M26 Native V2 browser evidence validation
        run: npm run test:m26

      - name: Run M27 V1 browser evidence validation
        run: npm run test:m27

      - name: Upload M26 and M27 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-m27-browser-evidence
          path: artifacts/m26/
          if-no-files-found: ignore

      - name: Run M87 real editor browser validation
        run: npm run test:m87

      - name: Upload M87 editor browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m87-editor-browser-evidence
          path: artifacts/m87/
          if-no-files-found: ignore

      - name: Run M90 real editor preview validation
        run: npm run test:m90

      - name: Upload M90 editor preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m90-editor-preview-evidence
          path: artifacts/m90/
          if-no-files-found: ignore

      - name: Run M28 paired V1 V2 browser comparison
        run: npm run test:m28

      - name: Run M408-M417 live preview inline-edit validation
        run: npm run test:m408-m417
      - name: Run M208-M217 real integrated fragmentation browser validation
        run: npm run test:m208-m217

      - name: Upload integrated fragmentation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-fragment-browser-evidence
          path: |
            tests/m178-m187/*.png
            tests/m208-m217/*.png
            tests/m208-m217/*.json
          if-no-files-found: ignore

      - name: Upload M27 V1 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m27-v1-browser-evidence
          path: artifacts/m27/
          if-no-files-found: ignore

      - name: Upload M28 paired browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m28-paired-v1-v2-browser-evidence
          path: artifacts/m28/
          if-no-files-found: ignore
