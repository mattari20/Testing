name: CV Workspace Validation

on:
  push:
    branches:
      - release/cv-builder-v2-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cv-workspace-controller
      - name: Production V2 boot regression test
        run: node --test tests/m1000-m1059/cv-production-entry.browser.test.js
      - run: node --test tests/m1000-m1059/cv-workspace.browser.test.js
      - run: node --test tests/m1000-m1059/cv-builder-ux.browser.test.js
      - name: Resume intelligence browser acceptance
        run: node --test tests/m1000-m1059/cv-resume-intelligence.browser.test.js
      - name: Final product closure browser acceptance
        run: node --test tests/m1000-m1059/cv-final-product.browser.test.js
