name: CV Workspace Validation

on:
  push:
    branches:
      - release/cv-builder-v2-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Targeted editor command and surface validation
        run: npm run test:m64 && npm run test:m67
      - name: Editor form and interaction validation
        run: npm run test:m72 && npm run test:m73 && npm run test:m75
      - name: Production editor runtime validation
        run: npm run test:m76-m81
      - name: Native V2 renderer validation
        run: npm run test:m14 && npm run test:m15 && npm run test:m16
