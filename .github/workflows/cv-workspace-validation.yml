name: CV Workspace Validation

on:
  push:
    branches:
      - release/cv-builder-v2-production
  pull_request:
    branches:
      - release/cv-builder-v2-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Install browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium for real mobile browser tests
        run: npx playwright install --with-deps chromium
      - name: Targeted editor command and surface validation
        run: npm run test:m64 && npm run test:m67
      - name: Editor form and interaction validation
        run: npm run test:m72 && npm run test:m73 && npm run test:m75
      - name: Production editor runtime validation
        run: npm run test:m76-m79 && npm run test:m80 && npm run test:m81
      - name: Native V2 renderer validation
        run: npm run test:m14 && npm run test:m15
      - name: Workspace persistence controller tests
        run: npm run test:cv-workspace-controller
      - name: Mobile browser workspace regressions
        run: npm run test:cv-workspace-browser
      - name: Skills and Languages migration regressions
        if: always()
        run: npm run test:r7-skills-languages
