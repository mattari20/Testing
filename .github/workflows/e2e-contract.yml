name: CV Builder V2 E2E Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:e2e-contract
