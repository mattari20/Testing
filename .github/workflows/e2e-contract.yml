name: CV Builder V2 E2E Contract
on:
  push:
    branches: [main, qa/pre-designed-section-library-release-port, qa/cv-workspace-release-gates, release/cv-builder-v2-production, restore/cv-builder-v2-accepted-milestone-20261013]
  pull_request:
    branches: [main]
jobs:
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:e2e-contract
