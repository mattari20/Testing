name: V2 Integration Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache is intentionally not enabled because this repository does not commit a package-lock.json.
      - run: npm install
      - run: npm run test:m48-m51
      - run: npm run test:m52-m55
      - run: npm run test:m56-m59
      - run: npm run test:m218-m227
      - run: npm run test:m238-m247
      - run: npm run test:m258-m267
      - run: npm run test:m268-m277
      - run: npm run test:m278-m287
      - run: npm run test:m288-m297
      - run: npm test
        continue-on-error: true
      - name: Upload validation metadata
        uses: actions/upload-artifact@v4
        with:
          name: v2-integration-validation
          path: |
            package.json
            docs/03-implementation/
